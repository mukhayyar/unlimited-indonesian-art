<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Unlimited Indonesian Art — Seni Nusantara Tak Terbatas</title>
<meta name="description" content="Infinite, procedurally generated line-art galleries of Indonesian heritage — Wayang, Batik, Candi, Bahari (pinisi) and Gunung. Inspired by shan-shui-inf."/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div id="stage"><noscript>Enable JavaScript to view the galleries.</noscript></div>

  <header id="titlecard">
    <h1>Seni Nusantara <span>Tak Terbatas</span></h1>
    <p>Infinite line-art galleries of Indonesian heritage. Pick a gallery, then drag to wander.</p>
  </header>

  <nav id="galleries" aria-label="Galleries"></nav>

  <div id="controls">
    <label>Seed <input id="seedInput" type="text" autocomplete="off" spellcheck="false"/></label>
    <button id="newSeed">🎲 Seed</button>
    <button id="palette"></button>
    <button id="auto">▶ Jalan</button>
    <button id="download">⬇ SVG</button>
    <span class="hint">seed: <b id="seedLabel"></b> · drag / ← →</span>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
